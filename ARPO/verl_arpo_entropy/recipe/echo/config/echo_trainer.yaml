hydra:
  searchpath:
    # First resolve ppo_trainer from ARPO script config so ECHO inherits
    # the same base schema used by ARPO launch scripts.
    - file://../scripts/config
    # Keep the upstream trainer config available for any extra defaults.
    - file://verl/trainer/config

defaults:
  # Inherit full ARPO/PPO defaults, then override only ECHO-specific knobs below.
  - ppo_trainer
  # System prompt candidates live in a dedicated file for readability.
  - echo_system_prompts
  - _self_

data:
  # Which system prompt candidate to inject at runtime (via rl_dataset.py).
  # Set to the suffix number of the desired system_prompt_N key below, or null to skip.
  active_system_prompt: 1

  # system_prompt_N keys are loaded from echo_system_prompts.yaml via Hydra defaults.

reward_model:
  # Start ECHO with a dedicated manager key so we can evolve reward logic independently.
  # Only consulted by phases whose strategy == "scorer".
  reward_manager: echo
  # Order in which the hierarchical phases are executed within each training
  # step. The first phase in this list runs its full GRPO pipeline
  # (rollout -> reward -> advantage -> actor/critic update) before the second
  # phase starts. Phases whose rollout budget is 0 are skipped regardless of
  # order. Must be a permutation of {"high_level", "low_level"}.
  phase_order: ["high_level", "low_level"]
  # Per-phase reward strategy. Each hierarchical phase independently selects how
  # its token-level reward tensor is produced. Both strategies emit a sparse
  # scalar at the last valid response token so GRPO's sum(dim=-1) recovers the
  # per-sample score directly (no extra aggregation needed in the trainer).
  # Supported strategies:
  #   scorer  -> ECHORewardManager + custom_reward_function on the decoded
  #              answer. Emits -1 on format failure, else the task score (e.g.
  #              F1 in deep_research_echo), at the last valid response token.
  #   entropy -> Per-token policy entropy over the phase's loss-mask tokens
  #              reduced to one per-sample scalar (sum or mean per
  #              `entropy.reduction`), optionally normalized by log(vocab_size)
  #              and scaled/clamped, written at the last valid response token.
  #              When `format_gate` is true, bad-format samples are overridden
  #              with `bad_format_penalty` and LL soft-fail samples (valid
  #              format but no <search>/<python>) are zeroed.
  phase_rewards:
    high_level:
      strategy: scorer
      # `entropy` block below is consulted only when strategy == "entropy".
      entropy:
        reduction: sum    # How per-token entropy is reduced to a per-sample scalar: {sum, mean}.
        scale: 1.0        # Multiplies the reduced entropy before writing the scalar.
        normalize: false  # If true, divide per-token entropy by log(vocab_size) for bounded scale.
        clamp_min: null   # Optional lower bound applied after scale/normalize.
        clamp_max: null   # Optional upper bound applied after scale/normalize.
        # When true, samples whose decoded response fails the scorer's
        # phase-local format/parse checks have their entropy scalar replaced
        # with `bad_format_penalty`, and LL soft-fail samples (valid format,
        # no tool invoked) are zeroed. Good-format samples keep their entropy
        # scalar untouched.
        format_gate: true
        # Terminal scalar written on format-gate failure. Only consulted when
        # format_gate is true. Matches the scorer strategy's hard-penalty value.
        bad_format_penalty: -1.0
    low_level:
      strategy: entropy
      entropy:
        # LL uses mean so per-sample advantage reflects average entropy per LL
        # token rather than the sum, which would be length-biased across
        # variable-length tool-call traces.
        reduction: mean
        scale: 1.0
        normalize: true
        clamp_min: null
        clamp_max: null
        format_gate: true
        bad_format_penalty: -1.0

actor_rollout_ref:
  rollout:
    # Use ECHO rollout implementation that emits hierarchical masks.
    mode: sync_echo
    # Number of rollouts per prompt used for the high-level masked update.
    # The low-level phase uses the remaining budget: n - high_level_budget.
    high_level_budget: ${actor_rollout_ref.rollout.n}
    # Which token category feeds into which hierarchical level ("high", "low", "none").
    # "result" blocks are always excluded (neither high nor low).
    # This block is the single source of truth: the format validator profile
    # (c1/c2/c3) is resolved from this dict at trainer init and fails fast if
    # the combination does not match a supported profile. Supported signatures:
    #   c1 (below): plan/reasoning/answer HL; tool choice + tool payload LL.
    #   c2: like c1 but `select: high` (non-initial <select> is HL).
    #   c3: like c1 but `search: high` and `python: high` (tool payloads are
    #       HL; prevents LL from entropy-hacking via junk tool-code tokens).
    mask_categories:
      first_select: high   # initial planning <select> block declaring the tool set
      select: low           # subsequent tool-selection <select> blocks
      think: high           # <think> reasoning blocks
      answer: high          # <answer> blocks
      search: low           # <search> tool-query blocks
      python: low           # <python> tool-code blocks
    tools:
      call_limit: 5         # max tool calls per sample during rollout
      max_workers: 64       # thread pool size for concurrent tool execution
      timeout: 120          # per-call timeout in seconds
      retry_count: 3        # retries on tool failure
      verbose_logging: false
      fail_on_error: false
      tool_instances:
        python:
          class_path: verl.workers.agent.tools.python_tool.PythonTool
          params:
            conda_path: /path/to/conda   # override from launch script
            conda_env: verl
        search:
          class_path: verl.workers.agent.tools.search_tool.BingSearchTool
          params:
            cache_file: null             # override from launch script

trainer:
  # Group experiments under a recipe-specific default project.
  project_name: verl-echo
