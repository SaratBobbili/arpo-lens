project_name: qwen3B
experiment_name: echo3B_maxent
nnodes: 1
n_gpus_per_node: 8

train_batch_size: 128
ppo_mini_batch_size: 16
max_prompt_length: 1536
max_response_length: 4096
train_files: rl_datasets/train_10k.parquet
valid_files: rl_datasets/valid.parquet

actor_model_subpath: checkpoints/Qwen2.5-3B-Instruct

rollout_n: 16
high_level_budget: 16  # all budget to HL; LL phase auto-skipped
enable_multi_turn: false
tensor_model_parallel_size: 1
gpu_memory_utilization: 0.7
search_cache_file: search_cache_echo_3B_maxent.json
search_class_path: verl.workers.agent.tools.search_tool.BingSearchTool
brightdata_timeout: 45

total_epochs: 2
save_freq: 5
test_freq: 5
max_actor_ckpt_to_keep: 1
resume_mode: ""
tool_call_limit: ""

phase_order: '["high_level", "low_level"]'
high_level_reward_strategy: maxentropy_rl

use_mask_categories: true
mask_tool: high
mask_think: high
mask_answer: high
mask_search: high
mask_python: high

use_ll_reward: false
low_level_reward_strategy: entropy

use_hl_maxent: true
max_entropy_alpha: 0.1

use_ll_entropy_params: false
ll_entropy_reg_coeff: 0
ll_entropy_reduction: mean
ll_entropy_scale: 1.0
ll_entropy_normalize: true
ll_format_gate: true
ll_bad_format_penalty: -0.1

use_rag: false
rag_server_url: "http://127.0.0.1:5003"
rag_similarity_threshold: 0.92
rag_topk: 1
rag_soft_fallback: true
rag_request_timeout: 30
