# Hydra config for the ECHO cross-checkpoint HL/LL ping-pong validation pipeline.
# All knobs that affect what is generated, scored, plotted, or where results land
# are set here so the launch script only carries env wiring + run-specific overrides.

hydra:
  job:
    # Don't chdir into hydra.run.dir; the driver writes under xckpt.output_dir
    # explicitly and downstream subprocess invocations rely on PYTHONPATH/cwd.
    chdir: false
  run:
    dir: ${xckpt.output_dir}/hydra

xckpt:
  # ============================ Checkpoint inputs ============================
  # Root containing global_step_<n>/actor FSDP shards (the ECHO training run).
  # The four input checkpoints are built as
  #   <checkpoint_root>/global_step_<step>/actor
  # for each step listed in hl_steps / ll_steps. Selection of which steps to
  # use is out of scope for this pipeline; just supply the step ids.
  checkpoint_root: /scratch/project/prj-02-llm-reasoning-shakkottai/saratb/ECHO/checkpoints/echo3B-rerun-entropy-coeff-0-penalty-0.1
  # Two HL global_step ids; HL phase will be evaluated from each.
  hl_steps: [10, 25]
  # Two LL global_step ids; LL phase will be evaluated from each.
  ll_steps: [10, 25]

  # FSDP -> HF merge cache. Each ECHO checkpoint is FSDP-sharded; vLLM consumes
  # only HF format, so we merge once per (run_name, step) and reuse across combos.
  # Cache layout: <hf_cache_dir>/<run_name>/global_step_<step>/
  hf_cache_dir: /scratch/project/prj-02-llm-reasoning-shakkottai/saratb/ECHO/xckpt_eval/merged_hf
  # Display name used in plots and as the cache subdir; defaults to the
  # checkpoint_root basename.
  run_name: echo3B-rerun-entropy-coeff-0-penalty-0.1

  # ============================ Output ============================
  # All artifacts (per-combo JSONLs, summary CSV, summary JSON, plots) land here.
  output_dir: /scratch/project/prj-02-llm-reasoning-shakkottai/saratb/ECHO/xckpt_eval/results

  # ============================ Data ============================
  data:
    # Validation parquet; same one consumed by the trainer.
    val_parquet: /scratch/user/saratb_tamu.edu/research/arpo-lens/ARPO/rl_datasets/valid.parquet
    # Field name in the parquet holding the chat-template message list.
    prompt_key: prompt
    # Max prompt token length after applying chat template; mirrors data.max_prompt_length.
    max_prompt_length: 1536
    # Active system_prompt_<N> key from system_prompts_yaml; mirrors trainer
    # data.active_system_prompt. Set to null to keep the parquet's own system prompt.
    active_system_prompt: 1
    # YAML containing system_prompt_1/2/3 (loaded for the active key).
    system_prompts_yaml: /scratch/user/saratb_tamu.edu/research/arpo-lens/ARPO/verl_arpo_entropy/recipe/echo/config/echo_system_prompts.yaml

  # ============================ Rollout ============================
  rollout:
    # Hard cap on response token count over the entire ping-pong; mirrors
    # actor_rollout_ref.rollout.response_length=4096 in the recipe.
    max_response_length: 4096
    # Hard upper bound on number of HL/LL turns per sample; safety net for
    # pathological no-progress / no-answer cases.
    max_turns: 24
    # Consecutive no-progress turns (no owned-close emitted by either phase)
    # before the sample is terminated as a failed rollout.
    no_progress_terminate: 2
    # Validator profile signature (mask_categories) the pipeline assumes; only
    # c1 is supported by the ping-pong logic. Forwarded to compute_score so the
    # scorer routes per-check HL/LL attribution consistently.
    mask_categories:
      first_select: high
      select: low
      think: high
      answer: high
      search: low
      python: low
    # vLLM sampling parameters used for *both* HL and LL engines on every turn.
    # Mirrors actor_rollout_ref.rollout.val_kwargs in the trainer (the only path
    # that drives the trainer's headline val-core/<data_source>/reward/mean@N).
    val_kwargs:
      do_sample: false
      temperature: 0
      top_k: -1
      top_p: 1.0
      n: 1

  # ============================ Tools ============================
  # Same tool surface as the recipe so hand-off rollouts execute tools the same
  # way training did. Matches recipe/echo/config/echo_trainer.yaml: search uses
  # the on-disk Bing cache + Brightdata SERP fallback, python uses the conda env.
  tools:
    # Per-sample tool call cap; mirrors recipe call_limit=3.
    call_limit: 3
    # Per-call retry count for tool execution.
    retry_count: 3
    # Thread-pool workers for parallel tool dispatch within a turn (one tool per
    # LL-stopped sample is queued in parallel).
    max_workers: 64
    # Per-call wall-clock timeout (s).
    timeout: 120
    instances:
      python:
        class_path: verl.workers.agent.tools.python_tool.PythonTool
        params:
          conda_path: /scratch/user/saratb_tamu.edu/miniconda3
          conda_env: arpo
      search:
        class_path: verl.workers.agent.tools.search_tool.BingSearchTool
        params:
          # Brightdata API token; sourced from the BRIGHTDATA_API_KEY env var (set
          # in the launch script). Errors out if neither env nor CLI override is
          # provided.
          api_key: ${oc.env:BRIGHTDATA_API_KEY,???}
          zone: serp_api1
          location: us
          request_timeout: 90
          # Standalone cache file for this pipeline; safe to point at the
          # training run's cache to share results, or keep separate to avoid
          # polluting the train-time cache.
          cache_file: /scratch/user/saratb_tamu.edu/research/arpo-lens/ARPO/search_cache/search_cache_xckpt_eval.json

  # ============================ Engine layout ============================
  engine:
    # Number of data-parallel shard workers. With 8 GPUs and dp=4, each DP slot
    # owns 2 GPUs (HL on one, LL on the other) at TP=1. Total GPUs used = 2*dp.
    dp: 4
    # GPU ids visible to this pipeline. Each pair of consecutive ids forms one
    # DP slot: slot k uses gpus[2*k] for HL and gpus[2*k+1] for LL. null means
    # "use 0..2*dp-1".
    gpus: null
    # vLLM gpu_memory_utilization for each engine.
    gpu_memory_utilization: 0.7
    dtype: bfloat16
    # vLLM max_model_len for both engines; must be >= max_prompt_length + max_response_length.
    max_model_len: 5760
    # Disable graph capture; matches launch script's TORCHDYNAMO_DISABLE=1 spirit.
    enforce_eager: false

  # ============================ Plotting ============================
  plot:
    # Title shown above the 2x2 grid of (HL_step, LL_step) F1 means.
    title: ECHO cross-checkpoint val F1 (HL × LL ping-pong)
    # PNG filename written under output_dir.
    filename: xckpt_val_summary.png
