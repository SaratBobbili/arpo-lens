hydra:
  searchpath:
    - file://${oc.env:VERL_ROOT}/verl/trainer/config

defaults:
  # Inherit full ARPO/PPO defaults, then override only ECHO-specific knobs below.
  - ppo_trainer
  # System prompt candidates live in a dedicated file for readability.
  - echo_system_prompts
  - _self_

data:
  # Prompt batch sizes are derived per phase from len(train_dataset) / phases.*.num_iters.
  # Which system prompt candidate to inject at runtime (via rl_dataset.py).
  # Set to the suffix number of the desired system_prompt_N key below, or null to skip.
  active_system_prompt: 1

  # system_prompt_N keys are loaded from echo_system_prompts.yaml via Hydra defaults.

reward_model:
  # Start ECHO with a dedicated manager key so we can evolve reward logic independently.
  reward_manager: echo

# Nested loop: for each of phases.high_level.num_iters outer cycles, run
# phases.low_level.num_iters low-level iterations and then one high-level iteration.
# Every knob a phase owns lives here: prompt-stream length, GRPO group size,
# PPO batch splits, optimizer/scheduler, rollout strategy and loss shaping.
# Which algorithm to run. Picks the trainer/worker/actor class tree in main_echo.py.
#   alternating   -> RayAlternatingGRPOTrainer: role-masked GRPO, two phases, no
#                    response term. The high-level iteration re-rolls the prompts the
#                    low-level phase just adapted on.
#   hypergradient -> RayECHOTrainer: the above plus ECHO Algorithm 1 -- transient
#                    follower, R_L follower return, g_dir + g_resp leader step.
# phases.response.* is only read on the hypergradient path.
# Lives under `phases` because verl already owns a top-level `algorithm` GROUP
# (algorithm.adv_estimator, algorithm.kl_ctrl), which cannot also be a scalar.

phases:
  algorithm: hypergradient
  # Prompts per phase iteration, for both algorithms. Must be a multiple of the rank
  # count. Was derived from N_HL*(N_LL+1), the Algorithm-1 round length, which is why an
  # alternating run inherited a bilevel batch size (136 rather than ARPO's 128, so
  # 136/16 left a ragged 9th mini-batch). num_iters now only controls loop counts.
  prompt_batch_size: 128
  # When true, LL and HL pull consecutive batches from one dataloader; one epoch
  # is N_HL*(N_LL+1) steps. When false, keep independent per-phase streams.
  shared_prompt_stream: true
  # ECHO Algorithm 1: the response-aware leader update.
  #
  # When enabled, one outer round is the paper's Stackelberg round rather than plain
  # alternating GRPO:
  #   1. snapshot W_x = w_core + x_t and reset the follower optimizer   (line 2, y_init = 0)
  #   2. K = low_level.num_iters follower GRPO steps on the tool return (lines 4-9)
  #   3. leader rollouts under (x_t, y_K); form g_dir and g_fol         (lines 10-12)
  #   4. g_resp = coef * sum_s sum_b <g_L,s,b, P*g_fol> * S_x,s,b       (Eqs. 15-16)
  #   5. restore W_x (discard y_K), then one leader step on g_dir+g_resp (lines 13-14)
  #
  # Setting enabled=false falls back to today's alternating masked GRPO, which is the
  # frozen-response gradient (g_dir alone) that Proposition 1 bounds the displacement of.
  response:
    # Algorithm 1's ROUND STRUCTURE: common-base snapshot and follower-optimizer reset
    # (line 2), discard of the adapted follower before the leader step (line 14), the
    # follower's own r_valid return (Eq. 2), one optimizer step per fresh group (C.3), and
    # the final re-adaptation (line 16). Independent of the response gradient below.
    enabled: true
    # Score the follower phase by R_L (v10 Eq. 2 / the first surrogate of Eq. 32: tool
    # validity) instead of the task return. null inherits `enabled`, which is the historical
    # coupling; set it explicitly to vary this on its own.
    #
    # Worth separating because `enabled` above changes FOUR things at once -- the follower's
    # reward, the follower discard, the round structure and the precondition for `gradient`.
    # A run with all four flipped cannot attribute its result to any one of them, which is
    # what made echo7B_sft1e8_rl1e-6-hypergrad-fix uninterpretable against the -r3 GRPO runs.
    # false + enabled:true  -> Algorithm 1's structure, task return in both phases
    # true  + enabled:false -> paper reward split, no round structure or response term
    follower_return: null
    # The response term g_resp itself. ON: its terminal seed g_fol now survives the tool
    # mask (the unmasked per-trajectory scalar of v10 Eq. (30) is carried alongside the
    # pre-masked token advantages), so the term is non-zero and carries the mechanism the
    # method is about -- reasoning changes the data the tool learner trains on.
    #
    # It implements the SAMPLING half of Eq. (35) only. Standing approximations, all named
    # in echo_response's docstring: no fixed-data half (needs an HVP, which FSDP1 cannot
    # provide), no cross-step coupling (v_s is held at g_fol), micro-batch blocks rather
    # than whole query groups, and eta_L as a plain scalar in `coef` rather than the
    # optimizer's derivative.
    #
    # Costs 2K extra full-batch forward/backward passes per round; replay_fraction throttles
    # that directly. Set false to fall back to first-order MAML, which is the honest
    # baseline for an A/B.
    gradient: true
    # Scale on the response term, and the only place eta_L enters. Untuned by default:
    # read high_level/actor/response_to_direct_ratio and response_direct_cosine after the
    # first leader step and set it from those.
    coef: 1.0
    # Fraction of stashed follower blocks replayed per leader update. Subsampling is
    # unbiased (the estimator is a sum over blocks, rescaled); it trades variance for the
    # 2K extra full-batch forward/backward passes the sweep costs.
    replay_fraction: 1.0
    # EXACT K=1 hypergradient instead of the sampling-half-only estimator above.
    #
    #   g_resp = grad^2 L_L . u  +  sum_b <g_grp,b , u> grad log p_b ,   u = D_0^T g_fol
    #
    # Everything the list above calls an approximation is gone rather than reduced:
    #   * the fixed-data half is present, as central differences on the GRADIENT --
    #     [grad L(w+eu) - grad L(w-eu)] / 2e, two ordinary backward passes at displaced
    #     weights. FSDP1 blocks double backward, not this;
    #   * the adjoint chain is RUN, not truncated -- see below;
    #   * both halves are evaluated at w_0, the point the follower step was taken FROM,
    #     which the leader iteration reaches through the round's own snapshot;
    #   * D_0 is the follower optimizer's true Jacobian, so eta_L stops being a knob and
    #     `coef` above is ignored.
    #
    # K = phases.low_level.num_iters is free, and K>1 no longer costs an approximation.
    # Eq. (51) evaluates either Hessian block against a vector as
    #   (Hhat_yc,s)^T v = (1/B_L) sum_b [ grad^fix_c <ghat_grp,b, v> + S_c,b <ghat_grp,b, v> ]
    # so once grad^fix is out (see `curvature`), the reverse sweep of Eq. (54) needs only a
    # scalar dot and one backward -- the same machinery the leader term already uses. With
    # shared routing (P_H = P_L = I) Eq. (48) gives S_x = S_y, so ONE accumulation per step
    # serves both the adjoint update and the leader contribution:
    #   v_s = v_{s+1} + eta_s u_s ,   g_resp = sum_s eta_s u_s ,   u_s = sum_b S_b <ghat_b, v_{s+1}>
    # i.e. the adjoint is g_fol plus the response term accumulated so far. Costs K host
    # weight snapshots per round (~3.5 GiB per rank each) and 2 passes per stashed block,
    # 4 with `curvature` on. What is still dropped is grad^fix, uniformly at c = x and
    # c = y; under Eq. (55) grad^fix_x vanishes and B_s is exact, grad^fix_y does not, so
    # A_s keeps an O(eta_L) error. Under the shared weights used here C.4 says both can
    # contribute -- this is the score-corrected estimator, not the exact hypergradient.
    #
    # Blocks are query-GROUP aligned: Eq. (49) pairs each group's own gradient with its own
    # score, and a token-budget micro-batch splits a group across bins, dropping the
    # within-group cross terms where GRPO's advantage centering lives.
    #
    # Requires phases.low_level.optim.optimizer=sgd and weight_decay=0, both asserted at
    # startup. To compare two K at a fixed batch, move N_HL the other way: the prompt batch
    # is (dataset // (N_HL*(N_LL+1))), so 36x(1+1) and 8x(8+1) both give 72 and 136.
    exact: false
    # The parametric half of H_yx,s -- grad^2 L_L,s . u_s, the central-difference term.
    # OFF by default, which leaves the exact path computing only the DISTRIBUTIONAL half,
    # sum_b <g_grp,s,b, u_s> grad log p_s,b.
    #
    # Off because the finite difference cannot be made honest through FSDP1's bf16
    # all-gather. The step is sized on a global norm, a = fd_rel * ||w|| / ||u||, but bf16
    # rounds per ELEMENT, so coordinate j survives the cast only if
    #   (|g_j|/|w_j|) / (||g||/||w||) > ~3e-3 / fd_rel,
    # i.e. only if its own gradient-to-weight ratio is within ~7x of the model-wide RMS
    # ratio at fd_rel=2e-2. In a transformer that ratio is heavy-tailed over orders of
    # magnitude, so most coordinates round straight back to w_j: measured 10-34% moving on
    # dense-gradient shards, and capped near the touched-vocab fraction (~6-17%) on the
    # ranks holding embed_tokens. The difference is then divided by the REQUESTED step,
    # which shrinks the term 20-70x, and the surviving direction is g_fol hard-thresholded
    # on |g_j|/|w_j| rather than on |g_j|. Raising fd_rel enough to fix it needs ~0.2-1,
    # which leaves the quadratic regime the difference quotient assumes.
    # `param_dtype=fp32` for the actor would fix both; on until someone pays for that.
    #
    # What stays exact with this off: step s is still evaluated at w_s, still carries its
    # own D_s = eta_L * min(1, clip/||ghat_s||), and the c baseline still applies. That is
    # strictly more than `exact: false` gives, which uses the current weights for every
    # record and folds eta_L into `coef` as a hand-tuned scalar.
    #
    # Naming: with this off the estimator is NOT the exact hypergradient, at any K. It is
    # the distributional half of one. Say that rather than "exact" in write-ups.
    curvature: false
    # Replay in query-GROUP units (Eq. 49's b) rather than token-budget blocks. OFF: the
    # partition cannot currently be made to agree across ranks. Excision gives every
    # budget-exhausted sample a fresh uid, so group COUNTS differ rank to rank; padding the
    # counts then leaves group SIZES differing, so a globally agreed per-group chunk count
    # is not locally achievable and gets clamped -- which desynced NCCL (some ranks in the
    # FSDP all-gather, others in the per-group dot all-reduce) and killed exact_k1 twice.
    # Independently, FSDP reduce-scatters, so p.grad is the DP mean over the eight groups
    # sitting at that index across ranks; the per-query pairing needs the record resharded
    # so each group spans all ranks. Leave off until both are done.
    group_aligned: false
    # Relative size of the central-difference step: e = fd_rel * ||w|| / ||u||. Sized
    # against the weights, not absolute, so the truncation error stays O(fd_rel^2) while
    # the perturbation still survives to the forward.
    #
    # 2e-2 is set by bf16, not by the truncation error. FSDP1 keeps the flat parameter in
    # fp32 but all-gathers a BF16 CAST of it for the forward, and bf16 resolves ~3.9e-3
    # relative, so a smaller step is partly rounded away before it is ever used. Measured
    # on a 4096x4096 shard at 0.02 scale, fraction of elements whose bf16 image moves:
    #   fd_rel  1e-3 -> 0.32   3e-3 -> 0.57   1e-2 -> 0.83   2e-2 -> 0.91   5e-2 -> 0.96
    # At 1e-3 the realised displacement is 1.9e-3 rather than 1e-3: not merely noisy,
    # biased. Only read when `curvature` above is on; see there for why that table, which
    # was measured at a PER-TENSOR 0.02, does not describe the global sizing this uses.
    # _hessian_vector_product logs the realised fraction as actor/hvp_bf16_moved_frac.
    fd_rel: 2e-2
  high_level:
    # Number of outer cycles. Prompt batch = (len(train_dataset) // num_iters) floored to a
    # multiple of the rank count; HL sees the dataset once over the whole run.
    num_iters: 1
    # GRPO group size (trajectories per prompt) for this phase's rollouts.
    group_size: 8
    # PPO update splits within one iteration's collected rollouts.
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: null
    # Independent AdamW + LR schedule over the shared FSDP parameters.
    # Scheduler horizon is derived: HL = num_iters, LL = N_HL * N_LL.
    optim:
      # "adamw" or "sgd". The follower must be sgd under phases.response.exact: AdamW's
      # first step from reset moments is sign-like, so its exact Jacobian is
      # lr*eps/(|g|+eps)^2 ~ 4e-12 and the hypergradient it implies is numerically zero.
      optimizer: adamw
      lr: 1e-6
      lr_warmup_steps: -1  # Prioritized. Negative means use lr_warmup_steps_ratio.
      lr_warmup_steps_ratio: 0.0
      warmup_style: constant  # constant/cosine
      min_lr_ratio: 0.0   # cosine only
      num_cycles: 0.5     # cosine only
      weight_decay: 0.01
    # Rollout generation strategy. Only affects generate_sequences; update is unchanged.
    #   default -> flat temperature sampling with group_size trajectories.
    #   aepo    -> AEPO entropy-guided initial budget + adaptive branching.
    # The aepo sub-block is only read when strategy == "aepo".
    rollout:
      strategy: default
      aepo:
        enable_dynamic_rollouts: false
        initial_rollouts: 8
        beam_size: 2
        branch_probability: 0.5
        entropy_weight: 0.2
        initial_entropy_tokens: 50
    # How token advantages are formed for the PG loss:
    #   grpo    -> Use GRPO advantages from scorer reward as-is.
    #   entropy -> Replace with scaled normalized entropy: A = alpha * H_norm.
    #   aepo    -> Modulate GRPO advantages by entropy: A = A_grpo * (1 + alpha * H_norm).
    advantage_algorithm: grpo
    kl_loss_coef: 0.0
    # use_sign_cond_clip enables asymmetric clip bounds (clip_ratio_*_pos/neg) using
    # the same advantages fed to the PG loss (token advantage sign).
    # use_aepo_clip applies the ratio-adaptive upper bound on top of whichever fixed
    # bounds sign-cond or global clip selected; the two flags compose independently.
    use_sign_cond_clip: false
    use_aepo_clip: false
    entropy:
      # How entropy is z-scored before use as an advantage signal:
      #   token_pool -> z-score over all valid tokens in the micro-batch (AEPO-style).
      #   group      -> reduce to per-sample mean, GRPO-normalize within prompt group,
      #                 then broadcast back to tokens.
      normalization: token_pool
      # Scaling weight for entropy-based advantage shaping (entropy and aepo).
      alpha: 0.2
      # Gate for the direct entropy regularizer below. This is lambda_ent H_tool in the
      # paper's u_L (Eq. 2). Default off, so each role is driven purely by its own return:
      # u_L = lambda_valid E[R_L], u_H = E[R_H]. reg_coeff is ignored unless this is true.
      enabled: false
      # Direct entropy regularizer: L_actor = L_PG - reg_coeff * mean(H) on the
      # phase loss mask. Applies to all advantage_algorithms. Requires enabled=true.
      reg_coeff: 0.0
    # On-Policy Entropy Flow Optimization (arXiv:2605.11491). When true, replace
    # clipped PPO PG with -log_prob·A reweighted by adaptive λ* from Theorem-1 ΔH.
    # Requires actor_rollout_ref.model.use_fused_kernels=false.
    opefo:
      enabled: false
  low_level:
    # Inner iterations per outer cycle. Prompt batch derived as above;
    # LL covers the dataset once per outer cycle.
    num_iters: 1
    group_size: 8
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: null
    optim:
      # "adamw" or "sgd". The follower must be sgd under phases.response.exact: AdamW's
      # first step from reset moments is sign-like, so its exact Jacobian is
      # lr*eps/(|g|+eps)^2 ~ 4e-12 and the hypergradient it implies is numerically zero.
      optimizer: adamw
      lr: 1e-6
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      warmup_style: constant
      min_lr_ratio: 0.0
      num_cycles: 0.5
      weight_decay: 0.01
    rollout:
      strategy: default
      aepo:
        enable_dynamic_rollouts: false
        initial_rollouts: 8
        beam_size: 2
        branch_probability: 0.5
        entropy_weight: 0.2
        initial_entropy_tokens: 50
    advantage_algorithm: entropy
    kl_loss_coef: 0.0
    use_sign_cond_clip: false
    use_aepo_clip: false
    entropy:
      normalization: token_pool
      alpha: 0.2
      # lambda_ent H_tool in u_L (Eq. 2). Off by default; see high_level.entropy.enabled.
      enabled: false
      reg_coeff: 0.0
    opefo:
      enabled: false

actor_rollout_ref:
  # Worker groups are constructed from this subtree alone, so mirror the phase tree in.
  # main_echo resolves the config before workers spawn, which materializes the copy.
  phases: ${phases}
  # Mirrored so phase LR schedulers can scale horizons by E when shared_prompt_stream.
  total_epochs: ${trainer.total_epochs}
  actor:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    clip_ratio_low_pos: 0.2
    clip_ratio_high_pos: 0.2
    clip_ratio_low_neg: 0.2
    clip_ratio_high_neg: 0.2
  rollout:
    # Use ECHO rollout implementation that emits hierarchical masks.
    mode: sync_echo
    # If true, phase-level masks (high/low/tool) exclude tag boundary tokens
    # (<think>, </think>, <tool>, ...).
    exclude_tag_tokens_from_phase_masks: true
    # Which token category feeds into which hierarchical level ("high", "low", "both", "none").
    # "result" blocks are always excluded. Prompt-5 schema: think/tool/search|python/answer.
    mask_categories:
      tool: low             # free-text <tool> rationale blocks
      think: high           # <think> reasoning blocks
      answer: high          # <answer> blocks
      search: low           # <search> tool-query blocks
      python: low           # <python> tool-code blocks
    tools:
      call_limit: 5         # max tool calls per sample during rollout
      max_workers: 64       # thread pool size for concurrent tool execution
      timeout: 120          # per-call timeout in seconds
      retry_count: 3        # retries on tool failure
      # Reduce live API failures (cache + timeouts): set tool_instances.search.params.cache_file,
      # tool_instances.search.params.request_timeout, and override tools.retry_count / tools.timeout from the launch script as needed.
      # When true, rollouts where any tool exhausted retries emit tool_rollout_failed; ECHO zeros phase masks/rewards and isolates uid so GRPO skips them. When false (default), failed tool rollouts train normally.
      skip_training_on_tool_failure: false
      # DEPRECATED, read only when budget_exhausted_mode is null: true -> "excise", false -> "none".
      skip_training_on_budget_exhausted: true
      # What to do with a rollout that spends its whole tool budget and STILL fails the format
      # gate after the final answer-me turn it is given (see vllm_rollout_echo). Rollouts that
      # exhaust the budget and DO answer legally are scored normally and never land here.
      #   in_group_zero  reward 0, uid kept. The group baseline drops, so the siblings that
      #                  answered get a positive advantage and these get a negative one. Default.
      #   excise         reward 0 + fresh uid -> singleton group -> advantage exactly 0, no
      #                  gradient. This is what ran up to 2026-09-19; it hid the dominant failure
      #                  mode from the optimizer and let echo7B_sft1e8_rl1e-6-r3 collapse into
      #                  "spend every call, never answer" with nothing opposing the drift.
      #   none           leave the scorer's -1 format penalty in place.
      budget_exhausted_mode: in_group_zero
      verbose_logging: false
      fail_on_error: false
      tool_instances:
        python:
          class_path: verl.workers.agent.tools.python_tool.PythonTool
          params:
            conda_path: /scratch/user/saratb_tamu.edu/miniconda3   # conda root used to locate the python interpreter for the tool subprocess
            conda_env: arpo                                        # env name under ${conda_path}/envs/ providing the interpreter + sympy/numpy etc.
        search:
          class_path: verl.workers.agent.tools.search_tool.BingSearchTool
          params:
            api_key: null                # Bright Data API token for api.brightdata.com/request; override from launch script
            zone: null                   # Bright Data SERP zone name (e.g. serp_api1); override from launch script
            cache_file: null             # on-disk search cache path; override from launch script
            location: us                 # Country code appended as &cc=<code> to the Bing URL; also selects the Bright Data proxy geo. "us" is faster/more reliable from this cluster than "cn".
            request_timeout: 120         # Per-HTTP-call read timeout (s) for api.brightdata.com; must exceed Brightdata SERP tail (~30-60s+ under load) to avoid spurious ReadTimeout retries.

trainer:
  # Group experiments under a recipe-specific default project.
  project_name: verl-echo
  # Outer epochs over the shared prompt stream. Used only when
  # phases.shared_prompt_stream is true; ignored on the legacy per-phase path.
  total_epochs: 4
  # Enable best-checkpoint tracking based on validation metrics.
  # When true, writes best_checkpoint/hf/ (~6GB) from the current global_step actor.
  save_best_checkpoint: false
  # Metric family to track for best checkpoint.
  # Supported: {val-core/reward, val-aux/f1-score}
  best_checkpoint_metric: val-core/reward
