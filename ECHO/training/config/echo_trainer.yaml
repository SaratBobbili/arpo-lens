hydra:
  searchpath:
    - file://${oc.env:VERL_ROOT}/verl/trainer/config

defaults:
  # Inherit full ARPO/PPO defaults, then override only ECHO-specific knobs below.
  - ppo_trainer
  # System prompt candidates live in a dedicated file for readability.
  - echo_system_prompts
  - _self_

data:
  # Prompt batch sizes are derived per phase from len(train_dataset) / phases.*.num_iters.
  # Which system prompt candidate to inject at runtime (via rl_dataset.py).
  # Set to the suffix number of the desired system_prompt_N key below, or null to skip.
  active_system_prompt: 1

  # system_prompt_N keys are loaded from echo_system_prompts.yaml via Hydra defaults.

reward_model:
  # Start ECHO with a dedicated manager key so we can evolve reward logic independently.
  reward_manager: echo

# Nested loop: for each of phases.high_level.num_iters outer cycles, run
# phases.low_level.num_iters low-level iterations and then one high-level iteration.
# Every knob a phase owns lives here: prompt-stream length, GRPO group size,
# PPO batch splits, optimizer/scheduler, rollout strategy and loss shaping.
phases:
  # When true, LL and HL pull consecutive batches from one dataloader; one epoch
  # is N_HL*(N_LL+1) steps. When false, keep independent per-phase streams.
  shared_prompt_stream: true
  # ECHO Algorithm 1: the response-aware leader update.
  #
  # When enabled, one outer round is the paper's Stackelberg round rather than plain
  # alternating GRPO:
  #   1. snapshot W_x = w_core + x_t and reset the follower optimizer   (line 2, y_init = 0)
  #   2. K = low_level.num_iters follower GRPO steps on the tool return (lines 4-9)
  #   3. leader rollouts under (x_t, y_K); form g_dir and g_fol         (lines 10-12)
  #   4. g_resp = coef * sum_s sum_b <g_L,s,b, P*g_fol> * S_x,s,b       (Eqs. 15-16)
  #   5. restore W_x (discard y_K), then one leader step on g_dir+g_resp (lines 13-14)
  #
  # Setting enabled=false falls back to today's alternating masked GRPO, which is the
  # frozen-response gradient (g_dir alone) that Proposition 1 bounds the displacement of.
  response:
    # Algorithm 1's ROUND STRUCTURE: common-base snapshot and follower-optimizer reset
    # (line 2), discard of the adapted follower before the leader step (line 14), the
    # follower's own r_valid return (Eq. 2), one optimizer step per fresh group (C.3), and
    # the final re-adaptation (line 16). Independent of the response gradient below.
    enabled: true
    # The response term g_resp itself (Eqs. 10-11). DEFAULT OFF, deliberately.
    #
    # The terminal seed g_fol is currently annihilated before it is used: the leader
    # batch's token advantages are already multiplied by the high-level mask
    # (compute_grpo_outcome_advantage does scores.unsqueeze(-1) * response_mask), and the
    # tool direction then applies the low-level mask to that product. The masks are
    # disjoint, so g_fol == 0, hence every c == 0 and g_resp == 0.
    #
    # v10 Eq. (30) defines the advantage as a per-trajectory SCALAR indexed (i, b, j); the
    # role mask only selects which tokens Eq. (31) sums over. Repairing this means keeping
    # an unmasked scalar task advantage and applying each role mask once, to its own loss.
    # Until then the sweep costs 2K extra full-batch passes per round to add exactly zero,
    # so it stays off.
    gradient: false
    # Scale on the response term. NOTE: the follower step size eta_L is NOT properly folded
    # in. The current lr/(sqrt(v_hat)+eps) factor is a frozen diagonal, not differentiation
    # through the optimizer: the true derivative of Adam's first update is
    # lr*eps/(g+eps)^2, which differs from lr/(g+eps) by ~5e6 at g=0.05. v10 C.3 requires
    # differentiating through the optimizer during the reverse sweep.
    coef: 1.0
    # Fraction of stashed follower blocks replayed per leader update. Subsampling is
    # unbiased (the estimator is a sum over blocks, rescaled); it trades variance for the
    # 2K extra full-batch forward/backward passes the sweep costs.
    replay_fraction: 1.0
  high_level:
    # Number of outer cycles. Prompt batch = (len(train_dataset) // num_iters) floored to a
    # multiple of the rank count; HL sees the dataset once over the whole run.
    num_iters: 1
    # GRPO group size (trajectories per prompt) for this phase's rollouts.
    group_size: 8
    # PPO update splits within one iteration's collected rollouts.
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: null
    # Independent AdamW + LR schedule over the shared FSDP parameters.
    # Scheduler horizon is derived: HL = num_iters, LL = N_HL * N_LL.
    optim:
      lr: 1e-6
      lr_warmup_steps: -1  # Prioritized. Negative means use lr_warmup_steps_ratio.
      lr_warmup_steps_ratio: 0.0
      warmup_style: constant  # constant/cosine
      min_lr_ratio: 0.0   # cosine only
      num_cycles: 0.5     # cosine only
      weight_decay: 0.01
    # Rollout generation strategy. Only affects generate_sequences; update is unchanged.
    #   default -> flat temperature sampling with group_size trajectories.
    #   aepo    -> AEPO entropy-guided initial budget + adaptive branching.
    # The aepo sub-block is only read when strategy == "aepo".
    rollout:
      strategy: default
      aepo:
        enable_dynamic_rollouts: false
        initial_rollouts: 8
        beam_size: 2
        branch_probability: 0.5
        entropy_weight: 0.2
        initial_entropy_tokens: 50
    # How token advantages are formed for the PG loss:
    #   grpo    -> Use GRPO advantages from scorer reward as-is.
    #   entropy -> Replace with scaled normalized entropy: A = alpha * H_norm.
    #   aepo    -> Modulate GRPO advantages by entropy: A = A_grpo * (1 + alpha * H_norm).
    advantage_algorithm: grpo
    kl_loss_coef: 0.0
    # use_sign_cond_clip enables asymmetric clip bounds (clip_ratio_*_pos/neg) using
    # the same advantages fed to the PG loss (token advantage sign).
    # use_aepo_clip applies the ratio-adaptive upper bound on top of whichever fixed
    # bounds sign-cond or global clip selected; the two flags compose independently.
    use_sign_cond_clip: false
    use_aepo_clip: false
    entropy:
      # How entropy is z-scored before use as an advantage signal:
      #   token_pool -> z-score over all valid tokens in the micro-batch (AEPO-style).
      #   group      -> reduce to per-sample mean, GRPO-normalize within prompt group,
      #                 then broadcast back to tokens.
      normalization: token_pool
      # Scaling weight for entropy-based advantage shaping (entropy and aepo).
      alpha: 0.2
      # Gate for the direct entropy regularizer below. This is lambda_ent H_tool in the
      # paper's u_L (Eq. 2). Default off, so each role is driven purely by its own return:
      # u_L = lambda_valid E[R_L], u_H = E[R_H]. reg_coeff is ignored unless this is true.
      enabled: false
      # Direct entropy regularizer: L_actor = L_PG - reg_coeff * mean(H) on the
      # phase loss mask. Applies to all advantage_algorithms. Requires enabled=true.
      reg_coeff: 0.0
    # On-Policy Entropy Flow Optimization (arXiv:2605.11491). When true, replace
    # clipped PPO PG with -log_prob·A reweighted by adaptive λ* from Theorem-1 ΔH.
    # Requires actor_rollout_ref.model.use_fused_kernels=false.
    opefo:
      enabled: false
  low_level:
    # Inner iterations per outer cycle. Prompt batch derived as above;
    # LL covers the dataset once per outer cycle.
    num_iters: 1
    group_size: 8
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: null
    optim:
      lr: 1e-6
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      warmup_style: constant
      min_lr_ratio: 0.0
      num_cycles: 0.5
      weight_decay: 0.01
    rollout:
      strategy: default
      aepo:
        enable_dynamic_rollouts: false
        initial_rollouts: 8
        beam_size: 2
        branch_probability: 0.5
        entropy_weight: 0.2
        initial_entropy_tokens: 50
    advantage_algorithm: entropy
    kl_loss_coef: 0.0
    use_sign_cond_clip: false
    use_aepo_clip: false
    entropy:
      normalization: token_pool
      alpha: 0.2
      # lambda_ent H_tool in u_L (Eq. 2). Off by default; see high_level.entropy.enabled.
      enabled: false
      reg_coeff: 0.0
    opefo:
      enabled: false

actor_rollout_ref:
  # Worker groups are constructed from this subtree alone, so mirror the phase tree in.
  # main_echo resolves the config before workers spawn, which materializes the copy.
  phases: ${phases}
  # Mirrored so phase LR schedulers can scale horizons by E when shared_prompt_stream.
  total_epochs: ${trainer.total_epochs}
  actor:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    clip_ratio_low_pos: 0.2
    clip_ratio_high_pos: 0.2
    clip_ratio_low_neg: 0.2
    clip_ratio_high_neg: 0.2
  rollout:
    # Use ECHO rollout implementation that emits hierarchical masks.
    mode: sync_echo
    # If true, phase-level masks (high/low/tool) exclude tag boundary tokens
    # (<think>, </think>, <tool>, ...).
    exclude_tag_tokens_from_phase_masks: true
    # Which token category feeds into which hierarchical level ("high", "low", "both", "none").
    # "result" blocks are always excluded. Prompt-5 schema: think/tool/search|python/answer.
    mask_categories:
      tool: low             # free-text <tool> rationale blocks
      think: high           # <think> reasoning blocks
      answer: high          # <answer> blocks
      search: low           # <search> tool-query blocks
      python: low           # <python> tool-code blocks
    tools:
      call_limit: 5         # max tool calls per sample during rollout
      max_workers: 64       # thread pool size for concurrent tool execution
      timeout: 120          # per-call timeout in seconds
      retry_count: 3        # retries on tool failure
      # Reduce live API failures (cache + timeouts): set tool_instances.search.params.cache_file,
      # tool_instances.search.params.request_timeout, and override tools.retry_count / tools.timeout from the launch script as needed.
      # When true, rollouts where any tool exhausted retries emit tool_rollout_failed; ECHO zeros phase masks/rewards and isolates uid so GRPO skips them. When false (default), failed tool rollouts train normally.
      skip_training_on_tool_failure: false
      # When a rollout spends its whole tool budget it now receives a masked <result> notice and a
      # final turn to answer (see vllm_rollout_echo), instead of a bare EOS mid-call. A bare EOS
      # left no <answer>, which the scorer's format gate punished with -1 -- turning "ran out of
      # tool budget" into a format penalty and teaching the policy to stop calling tools. When this
      # flag is true, any rollout that still fails the format gate after that final turn has its
      # reward zeroed and its uid isolated, so it contributes 0 rather than -1. Rollouts that
      # exhaust the budget and DO answer legally are scored normally.
      skip_training_on_budget_exhausted: true
      verbose_logging: false
      fail_on_error: false
      tool_instances:
        python:
          class_path: verl.workers.agent.tools.python_tool.PythonTool
          params:
            conda_path: /scratch/user/saratb_tamu.edu/miniconda3   # conda root used to locate the python interpreter for the tool subprocess
            conda_env: arpo                                        # env name under ${conda_path}/envs/ providing the interpreter + sympy/numpy etc.
        search:
          class_path: verl.workers.agent.tools.search_tool.BingSearchTool
          params:
            api_key: null                # Bright Data API token for api.brightdata.com/request; override from launch script
            zone: null                   # Bright Data SERP zone name (e.g. serp_api1); override from launch script
            cache_file: null             # on-disk search cache path; override from launch script
            location: us                 # Country code appended as &cc=<code> to the Bing URL; also selects the Bright Data proxy geo. "us" is faster/more reliable from this cluster than "cn".
            request_timeout: 120         # Per-HTTP-call read timeout (s) for api.brightdata.com; must exceed Brightdata SERP tail (~30-60s+ under load) to avoid spurious ReadTimeout retries.

trainer:
  # Group experiments under a recipe-specific default project.
  project_name: verl-echo
  # Outer epochs over the shared prompt stream. Used only when
  # phases.shared_prompt_stream is true; ignored on the legacy per-phase path.
  total_epochs: 4
  # Enable best-checkpoint tracking based on validation metrics.
  # When true, writes best_checkpoint/hf/ (~6GB) from the current global_step actor.
  save_best_checkpoint: false
  # Metric family to track for best checkpoint.
  # Supported: {val-core/reward, val-aux/f1-score}
  best_checkpoint_metric: val-core/reward
