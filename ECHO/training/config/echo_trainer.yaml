hydra:
  searchpath:
    - file://${oc.env:VERL_ROOT}/verl/trainer/config

defaults:
  # Inherit full ARPO/PPO defaults, then override only ECHO-specific knobs below.
  - ppo_trainer
  # System prompt candidates live in a dedicated file for readability.
  - echo_system_prompts
  - _self_

data:
  # Dataloader read size per fetch; set > train_batch_size when using per-phase DAPO dynamic sampling.
  gen_batch_size: ${data.train_batch_size}
  # Which system prompt candidate to inject at runtime (via rl_dataset.py).
  # Set to the suffix number of the desired system_prompt_N key below, or null to skip.
  active_system_prompt: 1

  # system_prompt_N keys are loaded from echo_system_prompts.yaml via Hydra defaults.

reward_model:
  # Start ECHO with a dedicated manager key so we can evolve reward logic independently.
  # Only consulted by phases whose strategy == "scorer".
  reward_manager: echo
  # Order in which the hierarchical phases are executed within each training
  # step. The first phase in this list runs its full GRPO pipeline
  # (rollout -> reward -> advantage -> actor/critic update) before the second
  # phase starts. Phases whose rollout budget is 0 are skipped regardless of
  # order. Must be a permutation of {"high_level", "low_level"}.
  phase_order: ["high_level", "low_level"]
  # Number of full phase updates to run before switching to the next phase in
  # phase_order. Each repeated phase update counts as one training/global step.
  phase_update_repeats:
    high_level: 1
    low_level: 1
  # Per-phase reward strategy. Scorer reward is always computed for all phases.
  # The strategy controls how advantages are shaped inside update_policy using
  # the current (new) policy's entropy.
  # Supported strategies:
  #   scorer  -> Use GRPO advantage from scorer reward as-is.
  #   entropy -> Replace GRPO advantage with scaled normalized entropy:
  #              A = alpha * H_norm.
  #   aepo    -> Modulate scorer GRPO advantage by entropy:
  #              A = A_scorer * (1 + alpha * H_norm).
  phase_rewards:
    high_level:
      # grpo: single rollout pass per step (shared prompts with other GRPO phases).
      # dapo: dynamic sampling — keep prompt groups only if filter metric std > 0.
      algorithm: grpo
      kl_loss_coef: 0.0
      filter_groups:
        enable: false
        metric: seq_reward
        max_num_gen_batches: 10
      strategy: scorer
      entropy:
        # How entropy is z-scored before use as an advantage signal:
        #   token_pool -> z-score over all valid tokens in the micro-batch (AEPO-style).
        #   group      -> reduce to per-sample mean, GRPO-normalize within prompt group,
        #                 then broadcast back to tokens.
        normalization: token_pool
        # Scaling weight for entropy-based advantage shaping (entropy and aepo).
        alpha: 0.2
        # Direct entropy regularizer: L_actor = L_PG - reg_coeff * mean(H) on the
        # phase loss mask. 0.0 disables. Applies to all three strategies.
        reg_coeff: 0.0
    low_level:
      algorithm: grpo
      kl_loss_coef: 0.0
      filter_groups:
        enable: false
        metric: seq_reward
        max_num_gen_batches: 10
      strategy: entropy
      entropy:
        normalization: token_pool
        alpha: 0.2
        reg_coeff: 0.0

actor_rollout_ref:
  actor:
    use_sign_cond_clip: false
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    clip_ratio_low_pos: 0.2
    clip_ratio_high_pos: 0.2
    clip_ratio_low_neg: 0.2
    clip_ratio_high_neg: 0.2
  rollout:
    # Use ECHO rollout implementation that emits hierarchical masks.
    mode: sync_echo
    # If true, phase-level masks (high/low/select/first_select/tool) exclude tag
    # boundary tokens (<think>, </think>, <select>, ...). non_border_loss_mask
    # remains unchanged and still excludes tag boundaries for entropy reductions.
    exclude_tag_tokens_from_phase_masks: true
    # Number of rollouts per prompt used for the high-level masked update.
    # The low-level phase uses the remaining budget: n - high_level_budget.
    high_level_budget: ${actor_rollout_ref.rollout.n}
    # Which token category feeds into which hierarchical level ("high", "low", "none").
    # "result" blocks are always excluded (neither high nor low).
    # This block is the single source of truth: the format validator profile
    # (c1/c2/c3/c4) is resolved from this dict at trainer init and fails fast
    # if the combination does not match a supported profile. Supported
    # signatures:
    #   c1 (below): plan/reasoning/answer HL; tool choice + tool payload LL.
    #   c2: like c1 but `select: high` (non-initial <select> is HL).
    #   c3: like c1 but `search: high` and `python: high` (tool payloads are
    #       HL; prevents LL from entropy-hacking via junk tool-code tokens).
    #   c4: only `think`/`answer` HL; `first_select`, `select`, `search`,
    #       `python` are all LL. HL supervises reasoning + final answer only;
    #       LL owns the entire tool-planning + tool-payload stack.
    mask_categories:
      first_select: high   # initial planning <select> block declaring the tool set
      select: low           # subsequent tool-selection <select> blocks
      think: high           # <think> reasoning blocks
      answer: high          # <answer> blocks
      search: low           # <search> tool-query blocks
      python: low           # <python> tool-code blocks
    tools:
      call_limit: 5         # max tool calls per sample during rollout
      max_workers: 64       # thread pool size for concurrent tool execution
      timeout: 120          # per-call timeout in seconds
      retry_count: 3        # retries on tool failure
      # Reduce live API failures (cache + timeouts): set tool_instances.search.params.cache_file,
      # tool_instances.search.params.request_timeout, and override tools.retry_count / tools.timeout from the launch script as needed.
      # When true, rollouts where any tool exhausted retries emit tool_rollout_failed; ECHO zeros phase masks/rewards and isolates uid so GRPO skips them. When false (default), failed tool rollouts train normally.
      skip_training_on_tool_failure: false
      verbose_logging: false
      fail_on_error: false
      tool_instances:
        python:
          class_path: verl.workers.agent.tools.python_tool.PythonTool
          params:
            conda_path: /scratch/user/saratb_tamu.edu/miniconda3   # conda root used to locate the python interpreter for the tool subprocess
            conda_env: arpo                                        # env name under ${conda_path}/envs/ providing the interpreter + sympy/numpy etc.
        search:
          class_path: verl.workers.agent.tools.search_tool.BingSearchTool
          params:
            api_key: null                # Bright Data API token for api.brightdata.com/request; override from launch script
            zone: null                   # Bright Data SERP zone name (e.g. serp_api1); override from launch script
            cache_file: null             # on-disk search cache path; override from launch script
            location: us                 # Country code appended as &cc=<code> to the Bing URL; also selects the Bright Data proxy geo. "us" is faster/more reliable from this cluster than "cn".
            request_timeout: 120         # Per-HTTP-call read timeout (s) for api.brightdata.com; must exceed Brightdata SERP tail (~30-60s+ under load) to avoid spurious ReadTimeout retries.

trainer:
  # Group experiments under a recipe-specific default project.
  project_name: verl-echo
  # Enable best-checkpoint tracking based on validation metrics.
  # When true, writes best_checkpoint/hf/ (~6GB) from the current global_step actor.
  save_best_checkpoint: false
  # Metric family to track for best checkpoint.
  # Supported: {val-core/reward, val-aux/f1-score}
  best_checkpoint_metric: val-core/reward
  # If one phase budget is zero, still compute that phase's logging metrics
  # from the other phase's rollouts (no extra rollout generation, no updates).
  log_zero_budget_phase_metrics: true
