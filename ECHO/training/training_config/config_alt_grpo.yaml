# ALTERNATING-GRPO: role-masked GRPO over two phases, NO response term.
#
# This is NOT ARPO. It is the alternating baseline, run at the hyperparameters ARPO
# uses, so its numbers are comparable to the published ARPO/GRPO/DAPO/RFPP results.
# Those values are identical across every script in ARPO/scripts/:
#   prompt_batch_size 128, ppo_mini_batch_size 16, group_size 16, ppo_epochs 1
#   -> 128/16 = 8 optimizer steps per phase iteration, 16*16/8 = 32 seq/rank/step.
# ppo_max_token_len_per_gpu 11264 is already ARPO's 2*(1536+4096).
#
# 128/16 divides evenly. The r3/r4 profiles inherited ARPO's mini=16 but took their
# batch from the Algorithm-1 round equation (136), so 136/16 = 8.5 left them running a
# ragged 9th mini-batch every iteration.
#
# The high-level iteration re-rolls the prompts the low-level phase just adapted on --
# same prompts, fresh rollouts from the updated policy. See
# RayAlternatingGRPOTrainer._next_batch_dict. HYPERGRADIENT does not do this; Algorithm 1
# draws distinct query groups for follower and leader (C.3/C.4).
#
# phases.algorithm=alternating selects RayAlternatingGRPOTrainer / PhaseActorRolloutRefWorker
# / DataParallelPhaseActor, none of which read phases.response.*.
algorithm: alternating
prompt_batch_size: 128

# shared
project_name: Qwen2.5-7B-Instruct
experiment_name: Experiment-alt-grpo
active_system_prompt: 1
nnodes: 1
n_gpus_per_node: 8

max_prompt_length: 1536
max_response_length: 4096
prompt_key: prompt
train_files: rl_datasets/train_10k.parquet
valid_files: rl_datasets/valid.parquet

actor_model_subpath: checkpoints/Qwen2.5-7B-Instruct-lr1e8-ep1
reward_manager: echo

rollout_n: 16
enable_multi_turn: false
tensor_model_parallel_size: 1
# Kept at the HYPERGRADIENT profiles' value so memory behaviour is comparable. That
# path needed the headroom for the response term's full-size buffer (at 0.7 a 7B run
# OOMed in vLLM wake_up, cumem_allocator.cpp:62); this path has no such buffer, so 0.6
# is conservative here and can be raised once a run survives several
gpu_memory_utilization: 0.6
rollout_name: vllm
rollout_mode: sync_echo
exclude_tag_tokens_from_phase_masks: false
search_cache_file: search_cache_final_7B_d.json
search_class_path: verl.workers.agent.tools.search_tool.BingSearchTool
brightdata_timeout: 90
tool_call_limit: 3

save_freq: 1
test_freq: 1
save_best_checkpoint: true
best_checkpoint_metric: val-core/reward
max_actor_ckpt_to_keep: 1
# Adam moments are ~113 GiB of every ~142 GiB checkpoint (8 shards x 14 GiB vs 8 x 3.6 GiB
# of fp32 weights) and are only useful for resuming THIS run. Dropping them still saves
# weights + lr_scheduler + RNG, so an auto-resume restores the policy exactly and only the
# optimizer moments restart from zero -- safe here because warmup_style is constant, so
# there is no LR schedule state to lose. Set to "[model,optimizer,extra]" for exact resume.
checkpoint_contents: "[model,extra]"
# disable, not auto: these two arms crashed on the bf16 guard and left run dirs behind.
# `auto` would sweep any global_step_* in the target dir back in, and the dir name is
# derived from experiment_name, so a re-launch lands on top of the old one.
resume_mode: disable

shared_prompt_stream: true
total_epochs: 4

norm_adv_by_std_in_grpo: off

mask_tool: low
mask_think: high
mask_answer: high
mask_search: low
mask_python: low

clip_ratio_low: 0.2
clip_ratio_high: 0.2
clip_ratio_c: 3.0
clip_ratio_low_pos: 0.2
clip_ratio_high_pos: 0.2
clip_ratio_low_neg: 0.2
clip_ratio_high_neg: 0.2

# --- high_level ---
# shared stream batch: (10000 // (N_HL*(N_LL+1))) floored to a multiple of 8 ranks = 136 prompts (N=8 → 72 steps/epoch).
hl_num_iters: 8
hl_group_size: 16
hl_ppo_mini_batch_size: 16
hl_lr: 1e-6
high_level_advantage_algorithm: grpo
high_level_use_sign_cond_clip: True
hl_kl_loss_coef: 0.000
hl_entropy_enabled: false
hl_entropy_reg_coeff: 0.0
hl_entropy_normalization: token_pool
hl_entropy_alpha: 0.2

# --- low_level ---
ll_num_iters: 8
ll_group_size: 16
ll_ppo_mini_batch_size: 16
ll_lr: 1e-6
# AdamW for both phases. The SGD requirement is HYPERGRADIENT-only: it exists so that
# D_s = eta_L * I is the follower's exact optimizer Jacobian. Nothing differentiates
# through the update here, so the low-level phase uses the same optimizer as the high.
ll_optimizer: adamw
# Standard decay on both phases. The zero-decay requirement is HYPERGRADIENT-only
# (coupled decay puts an unmodelled lambda*I into d ghat/dx); no such term here.
ll_weight_decay: 0.01
low_level_advantage_algorithm: grpo
low_level_use_sign_cond_clip: True
ll_kl_loss_coef: 0.000
ll_entropy_enabled: false
ll_entropy_reg_coeff: 0.0
ll_entropy_normalization: token_pool
ll_entropy_alpha: 0.2
low_level_rollout_strategy: default
ll_aepo_initial_rollouts: 8
ll_aepo_beam_size: 2
ll_aepo_branch_probability: 0.5
ll_aepo_entropy_weight: 0.2

# ppo_mini_batch_size 16 against prompt_batch_size 128 gives EIGHT optimizer steps per
# phase iteration, over disjoint 16-prompt slices of one rollout -- ARPO's setting. The
# first step has ratio == 1; the rest run against the same frozen behaviour snapshot, so
# clipping is live. The one-step-per-iteration rule is HYPERGRADIENT-only (C.3, K = N_LL).
loss_agg_mode: token-mean
