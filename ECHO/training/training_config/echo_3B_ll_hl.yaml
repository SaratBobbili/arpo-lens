project_name: qwen3BInst
experiment_name: echo3BInst_hierarchical_with_low_level_aepo
nnodes: 1
n_gpus_per_node: 8

train_batch_size: 128
ppo_mini_batch_size: 16
max_prompt_length: 1536
max_response_length: 4096
prompt_key: prompt
train_files: rl_datasets/train_10k.parquet
valid_files: rl_datasets/valid.parquet

actor_model_subpath: checkpoints/Qwen2.5-3B-Instruct
reward_manager: echo

rollout_n: 16
high_level_budget: 16
low_level_budget: 16
reuse_phase_rollouts: false
enable_multi_turn: false
tensor_model_parallel_size: 1
gpu_memory_utilization: 0.6
rollout_name: vllm
rollout_mode: sync_echo
exclude_tag_tokens_from_phase_masks: false
search_cache_file: search_cache_echo_3B.json
search_class_path: verl.workers.agent.tools.search_tool.BingSearchTool
brightdata_timeout: 90
tool_call_limit: 3

total_epochs: 2
save_freq: 5
test_freq: 5
save_best_checkpoint: true
best_checkpoint_metric: val-core/reward
max_actor_ckpt_to_keep: 1
resume_mode: auto

phase_order: '["high_level", "low_level"]'
high_level_update_repeats: 1
low_level_update_repeats: 1
high_level_advantage_algorithm: grpo
low_level_advantage_algorithm: aepo
norm_adv_by_std_in_grpo: True

mask_first_select: low
mask_select: low
mask_think: high
mask_answer: high
mask_search: low
mask_python: low

high_level_use_sign_cond_clip: true
low_level_use_sign_cond_clip: true
clip_ratio_low: 0.2
clip_ratio_high: 0.2
clip_ratio_c: 3.0
clip_ratio_low_pos: 0.4
clip_ratio_high_pos: 0.4
clip_ratio_low_neg: 0.2
clip_ratio_high_neg: 0.2

hl_kl_loss_coef: 0.0
ll_kl_loss_coef: 0.0
hl_use_aepo_clip: false
ll_use_aepo_clip: true

hl_entropy_reg_coeff: 0.0
ll_entropy_reg_coeff: 0.0
hl_entropy_normalization: token_pool
ll_entropy_normalization: group
hl_entropy_alpha: 0.2
ll_entropy_alpha: 0.2

low_level_rollout_strategy: aepo
ll_aepo_initial_rollouts: 8
ll_aepo_beam_size: 2
ll_aepo_branch_probability: 0.5
ll_aepo_entropy_weight: 0.2