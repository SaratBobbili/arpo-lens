# shared
project_name: qwen3B
experiment_name: echo3B_ll_hl_rag
active_system_prompt: 1
nnodes: 1
n_gpus_per_node: 8

train_batch_size: 128
ppo_mini_batch_size: 16
max_prompt_length: 1536
max_response_length: 4096
train_files: rl_datasets/train_10k.parquet
valid_files: rl_datasets/valid.parquet

actor_model_subpath: checkpoints/Qwen2.5-3B-Instruct

rollout_n: 16
enable_multi_turn: false
tensor_model_parallel_size: 1
gpu_memory_utilization: 0.7
search_cache_file: search_cache_echo_3B_rag.json
search_class_path: verl.workers.agent.tools.search_tool.BingSearchToolRAG
brightdata_timeout: 45
tool_call_limit: ""

total_epochs: 2
save_freq: 5
test_freq: 5
max_actor_ckpt_to_keep: 1
resume_mode: ""

phase_order: '["low_level", "high_level"]'

mask_tool: low
mask_think: high
mask_answer: high
mask_search: low
mask_python: low

# --- high_level ---
high_level_budget: 8
high_level_advantage_algorithm: grpo

# --- low_level ---
low_level_advantage_algorithm: entropy
ll_entropy_reg_coeff: 0
ll_entropy_normalization: token_pool
ll_entropy_alpha: 0.2
