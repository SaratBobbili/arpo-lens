### model
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: ../examples/deepspeed/ds_z3_config.json  # ZeRO-3 without CPU offload avoids CPUAdam JIT build path.

### dataset
dataset_dir: /scratch/user/saratb_tamu.edu/research/arpo-lens/LLaMA-Factory/arpo_train_sft/dataset_info
dataset: echo_dataset
template: qwen
cutoff_len: 15000
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 16
mask_tool_output_tags: result   # tool output is environment-supplied; RL masks it too (vllm_rollout_echo.py)
val_size: 0.01

### output
output_dir: checkpoints/qwen
logging_steps: 100
save_steps: 1000
save_total_limit: 12         # Keep every checkpoint so the best one can be selected downstream
save_only_model: true        # Weights only (~6GB vs ~41GB); no exact mid-run resume
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000



#logging
report_to: wandb
run_name: arpo_sft_qwen25_3b

### eval
# Validation loss only, for monitoring. Checkpoint selection is done externally on the
# agentic benchmarks, so `load_best_model_at_end` is deliberately left unset.
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 1000


